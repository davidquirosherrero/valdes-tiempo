name: Actualizar tiempo de Valdés

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar script
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python3 valdes_tiempo.py

      - name: Publicar valdes.json si ha cambiado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add valdes.json
          git diff --staged --quiet || git commit -m "Actualizar tiempo $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash origin main
          git push
